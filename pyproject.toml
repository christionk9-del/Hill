[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security-agent"
version = "0.1.0"
description = "AI security analyst agent for authorized, read-only security assessments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.12.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
