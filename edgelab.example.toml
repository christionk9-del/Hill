# Copy to edgelab.toml.  Keys can also come from env vars (ODDS_API_KEY).
db = "edgelab.db"
strategies_dir = "experiments"
mappings = "mappings.json"   # cross-venue links (see mappings.example.json / `edgelab match`)
store_quotes = true          # keep every raw price snapshot for later research

[sources.oddsapi]            # sportsbooks incl. Pinnacle/Betfair. Free key: the-odds-api.com
enabled = true
# api_key = "..."            # or export ODDS_API_KEY=...
sports = ["basketball_nba", "americanfootball_nfl", "icehockey_nhl", "soccer_epl"]
regions = ["us", "eu"]       # eu is where Pinnacle/Betfair live — needed for the sharp consensus
markets = ["h2h", "spreads", "totals"]

[sources.kalshi]             # politics / geopolitics / economics, no key needed
enabled = true
categories = ["Politics", "Elections", "World", "Economics"]
min_volume = 1000
max_pages = 5

[sources.polymarket]         # no key needed
enabled = true
min_liquidity = 5000
domains = ["politics", "geopolitics", "economics"]

[sources.manifold]           # play-money: signal only, never bet
enabled = true
domains = ["politics", "geopolitics", "economics"]
